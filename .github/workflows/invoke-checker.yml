name: invoke checker

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  invoke:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Invoke checker and show logs
        run: aws lambda invoke --function-name status-page-checker --log-type Tail --payload '{}' --cli-binary-format raw-in-base64-out --query LogResult --output text response.json | base64 -d

      - name: Show response
        run: cat response.json